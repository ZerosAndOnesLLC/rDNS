name: Release

# Builds release tarballs for every supported platform and attaches them to the
# GitHub release for the tag.
#
#   gh release create v1.19.0 --prerelease --title "rDNS v1.19.0" --notes "..."
#     -> this workflow uploads the binaries to that release.
#   git tag -a v1.19.0 -m "rDNS 1.19.0" && git push origin v1.19.0
#     -> this workflow creates the release as a PRE-RELEASE (notes taken from
#        CHANGELOG.md) and uploads the binaries.
#
# Promote a tested pre-release with:
#   gh release edit v1.19.0 --prerelease=false --latest
# Promotion fires publish.yml (GHCR image + crates.io).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.19.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - id: v
        name: Tag must match Cargo.toml version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v${VERSION}" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.label }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc builds on 22.04 so the binaries run on glibc >= 2.35 distros.
          - label: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extra: dist/rdns.service
          - label: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            extra: dist/rdns.service
          - label: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            extra: ""
          - label: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            extra: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          sh ci/package.sh "${{ needs.verify.outputs.version }}" "${{ matrix.label }}" \
            "target/${{ matrix.target }}/release" out ${{ matrix.extra }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.tar.xz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rdns-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  build-freebsd:
    name: build (freebsd-15-amd64)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      # Same script used for manual FreeBSD builds, so the tarball layout and
      # name (rdns-<ver>-freebsd-15-amd64.tar.xz) are unchanged.
      - uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: "15.1"
          usesh: true
          copyback: true
          run: |
            set -e
            sh freebsd/build-local.sh "${{ needs.verify.outputs.version }}"
            mkdir -p out
            cp /usr/obj/rdns-release/rdns-${{ needs.verify.outputs.version }}-*.tar.xz* out/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.tar.xz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rdns-freebsd
          path: out/*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [verify, build, build-freebsd]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Combined checksums
        run: |
          cd out
          cat ./*.sha256 | awk '{print $1"  "$2}' | sed 's#  \*#  #' | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/      { exit }
            found                  { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md for details." > notes.md
          {
            echo
            echo "### Downloads"
            echo
            echo "| Platform | File |"
            echo "|----------|------|"
            for f in out/*.tar.xz; do
              n=$(basename "$f")
              p=${n#rdns-"${VERSION}"-}; p=${p%.tar.xz}
              echo "| ${p} | \`${n}\` |"
            done
            echo
            echo "Each tarball contains \`rdns\`, \`rdns-control\`, an example config, the service file for that platform (systemd / rc.d), LICENSE and README."
            echo
            echo "### Verify"
            echo
            echo '```'
            cat out/SHA256SUMS
            echo '```'
            echo
            echo "Build provenance: \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`"
          } >> notes.md
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets"
            gh release upload "$TAG" out/* --clobber
          else
            echo "Creating pre-release $TAG"
            gh release create "$TAG" out/* \
              --verify-tag \
              --prerelease \
              --title "rDNS v${VERSION}" \
              --notes-file notes.md
          fi
          gh release view "$TAG" --json url -q .url
