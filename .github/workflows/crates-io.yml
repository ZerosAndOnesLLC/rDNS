name: crates.io

# Manually publishes rdns-server to crates.io for an existing release tag:
#
#   gh workflow run crates-io.yml -f tag=v1.19.0
#
# crates.io publishes are permanent (a version can only be yanked, never
# replaced), so this never runs automatically.
#
# Auth is crates.io trusted publishing (OIDC) — no long-lived token. One-time
# setup on crates.io: rdns-server -> Settings -> Trusted Publishing -> Add
# GitHub: owner ZerosAndOnesLLC, repo rDNS, workflow crates-io.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.19.0"
        required: true
      dry_run:
        description: "Package and verify only, don't upload"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: crates-io-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  publish:
    name: publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - id: v
        name: Tag must match Cargo.toml version
        run: |
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} is not a tag"
            exit 1
          fi
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v${VERSION}" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - id: check
        name: Skip if already on crates.io
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "rdns-release (https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/rdns-server/${{ steps.v.outputs.version }}")
          if [ "$CODE" = "200" ]; then
            echo "::notice::rdns-server ${{ steps.v.outputs.version }} is already on crates.io — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust
        if: steps.check.outputs.skip != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.check.outputs.skip != 'true'

      - name: Test
        if: steps.check.outputs.skip != 'true'
        run: cargo test --locked --no-fail-fast

      - name: cargo publish --dry-run
        if: steps.check.outputs.skip != 'true'
        run: cargo publish --dry-run --locked

      - id: auth
        if: steps.check.outputs.skip != 'true' && !inputs.dry_run
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: cargo publish
        if: steps.check.outputs.skip != 'true' && !inputs.dry_run
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      - name: Summary
        if: steps.check.outputs.skip != 'true'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run: rdns-server ${{ steps.v.outputs.version }} packaged and verified, not uploaded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published [rdns-server ${{ steps.v.outputs.version }}](https://crates.io/crates/rdns-server/${{ steps.v.outputs.version }})." >> "$GITHUB_STEP_SUMMARY"
          fi
